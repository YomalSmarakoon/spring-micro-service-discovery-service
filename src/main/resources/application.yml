spring:
  application:
    name: eureka-server
  config:
    import: "optional:configserver:"   # ✅ tell Spring to load config from Config Server
  cloud:
    config:
      uri: http://localhost:8071       # ✅ your Config Server URL
      fail-fast: true                  # (optional) make startup fail if config not reachable
    loadbalancer:
      ribbon:
        enabled: false

logging:
  logstash:
    destination: ${LOGSTASH_DESTINATION:localhost:5000}

  level:
    root: INFO
    org.springframework: INFO
    com.optimagrowth: DEBUG

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans